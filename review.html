<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Product review confirmation">
    <meta name="author" content="Emanuel Herrera">
    <title>Review Submitted</title>

    <link rel="stylesheet" href="styles/review.css">
    <script src="scripts/review.js" defer></script>
</head>

<body>
    <header>
        <h1>Review Submitted</h1>
    </header>

    <main>
        <section class="confirmation">
            <h2>Thank You!</h2>

            <p>
                Your product review has been successfully submitted.
            </p>

            <p>
                Reviews completed:
                <strong id="reviewCount">0</strong>
            </p>

            <a href="form.html">Submit Another Review</a>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Emanuel Herrera | Guatemala</p>
        <p>WDD 131 - Dynamic Web Fundamentals</p>
        <p>Last Modified: <span id="lastModified"></span></p>
    </footer>

    <script>
        document.querySelector("#lastModified").textContent = document.lastModified;
    </script>
</body>

</html>
