<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temple Album</title>
    <meta name="description" content="Explore a beautiful collection of temple photographs from around the world, featuring historic and modern temples in stunning locations.">
    <meta name="author" content="Emanuel Herrera">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="styles/temples.css">
    <link rel="stylesheet" href="styles/temples-large.css">
    <script src="scripts/temples.js" defer></script>

<body>

    <header>
        <div class="header-inner">
    
            <h2 class="site-title">
                <a href="temples.html">Temple Album</a>
            </h2>
    
            <button id="menu-button" class="menu-button" aria-label="Open navigation menu" aria-expanded="false"
                aria-controls="primary-nav">    
                <span class="menu-icon">☰</span>
    
            </button>
    
            <nav id="primary-nav" aria-label="Primary navigation">
                <a href="#home">Home</a>
                <a href="#old">Old</a>
                <a href="#new">New</a>
                <a href="#large">Large</a>
                <a href="#small">Small</a>
            </nav>
    
        </div>
    </header>


    <main id="home">

        <h1>Temple Album</h1>

        <section class="temple-grid" aria-label="Temple photographs">

            <figure id="old">

                <img src="images/salt-lake.jpg"
                    alt="Salt Lake Temple in Utah" loading="lazy" width="800" height="533">
                <figcaption>
                    Salt Lake Temple
                </figcaption>
            </figure>


            <figure>

                <img src="images/washington-dc.jpg"
                    alt="Washington D.C. Temple" loading="lazy" width="800" height="533">
                <figcaption>
                    Washington D.C. Temple
                </figcaption>
            </figure>


            <figure>

                <img src="images/rome.jpg"
                    alt="Rome Italy Temple" loading="lazy" width="800" height="533">
                <figcaption>
                    Rome Italy Temple
                </figcaption>
            </figure>


            <figure id="new">

                <img src="images/guatemala-city.jpg"
                    alt="Guatemala City Guatemala Temple" loading="lazy" width="800" height="533">
                <figcaption>
                    Guatemala City Guatemala Temple
                </figcaption>
            </figure>


            <figure>

                <img src="images/sydney.jpg"
                    alt="Sydney Australia Temple" loading="lazy" width="800" height="533">

                    Sydney Australia Temple

            <figure>

                <img src="images/provo-city.jpg"
                    alt="Provo City Center Temple" loading="lazy" width="800" height="533">

                <img src="images/hong-kong.jpg"

                    Hong Kong China Temple
                </figcaption>
            </figure>


            <figure id="small">

                <img src="images/santo-domingo.jpg"
                    alt="Santo Domingo Dominican Republic Temple" loading="lazy" width="800" height="533">
                <figcaption>
                    Santo Domingo Dominican Republic Temple
                </figcaption>
            </figure>

        </section>

    </main>


    <footer>
        <p>
            &copy; <span id="currentyear"></span> Emanuel Herrera - Guatemala City
