<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Product review form for Customers in the WDD 131 Dynamic Web Fundamentals course.">
    <meta name="author" content="Emanuel Herrera">
    <title>Product Review</title>

    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html">        
                
                <label for="product">Product Name</label>
                <select id="product" name="product" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>

                <label>Overall Rating</label>
                <div class="rating">
                    <label for="rating1">
                        <span>☆</span>
                        <input type="radio" id="rating1" name="rating" value="1" required>
                    </label>

                    <label for="rating2">
                        <span>☆☆</span>
                        <input type="radio" id="rating2" name="rating" value="2" required>
                    </label>

                    <label for="rating3">
                        <span>☆☆☆</span>
                        <input type="radio" id="rating3" name="rating" value="3" required>
                    </label>

                    <label for="rating4">
                        <span>☆☆☆☆</span>
                        <input type="radio" id="rating4" name="rating" value="4" required>
                    </label>

                    <label for="rating5">
                        <span>☆☆☆☆☆</span>
                        <input type="radio" id="rating5" name="rating" value="5" required>
                    </label>
                </div>

                <label for="installDate">Date of Installation</label>
                <input type="date" id="installDate" name="installDate" required>                    
                
                <p>Which features did you find most useful in the product?
                    <i>(Check all that apply)</i>
                </p>                

                <label for="feature1">
                    <input type="checkbox" id="feature1" name="features" value="easy">
                    Easy to use
                </label>

                <label for="feature2">
                    <input type="checkbox" id="feature2" name="features" value="durable">
                    Durable
                </label>

                <label for="feature3">
                    <input type="checkbox" id="feature3" name="features" value="design">
                    Good design
                </label>

                <label for="feature4">
                    <input type="checkbox" id="feature4" name="features" value="performance">
                    Good performance
                </label>            

                <label for="review">Written Review</label>
                <textarea id="review" name="review" rows="6" placeholder="Write your review here..."></textarea>

                <label for="username">User Name</label>
                <input type="text" id="username" name="username" autocomplete="name" placeholder="Optional">                          

            <input type="submit" value="Submit Review">

        </form>
    </main>

    <footer>
        <p>&copy; 2026 Emanuel Herrera | Guatemala</p>
        <p>WDD 131 - Dynamic Web Fundamentals</p>
        <p>Last Modified: <span id="lastModified"></span></p>
    </footer>

</body>

</html>
