<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Responsive images using the picture element">
    <meta name="author" content="Emanuel Herrera">
    <title>Responsive Images</title>
    <link rel="stylesheet" href="styles/responsive-images.css">
</head>

<body>
    <header>
        <h1>Responsive Images</h1>
    </header>

    <main>
        <div class="hero">
            <picture>
                <source srcset="images/hero-large.webp" media="(min-width: 1000px)">
                <source srcset="images/hero-medium.webp" media="(min-width: 500px)">
                <img src="images/hero-small.webp" alt="Beautiful temple exterior surrounded by the landscape"
                    width="1500" height="750">
            </picture>
        </div>
    </main>

    <footer>
        <p>Emanuel Herrera - Guatemala City</p>
    </footer>
</body>

</html>
